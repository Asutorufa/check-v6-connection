[monitor]
interval_seconds = 30
failure_threshold = 3
recovery_success_threshold = 2
recovery_wait_seconds = 10
reminder_interval_seconds = 1800
incident_expire_seconds = 3600

[telegram]
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id = -1001234567890
allowed_user_ids = [123456789]
# The HTTP timeout must be longer than the long-poll timeout.
connect_timeout_seconds = 10
request_timeout_seconds = 35
poll_timeout_seconds = 20

[probe]
# Interface on the Linux host/container, for example eth0, ens18, or wan.
interface = "eth0"
# Use an explicit DNS server so the system resolver/TUN DNS is not used.
# IPv4 DNS is fine; the query itself asks for an AAAA record.
dns_server = "1.1.1.1:53"
dns_timeout_seconds = 3
ping_timeout_seconds = 3

[openwrt]
host = "192.168.1.1"
port = 22
username = "root"
# Key authentication (recommended):
private_key = "/etc/openwrt-ipv6-watch/id_ed25519"
# Password authentication alternative. The password is read from this
# environment variable and is never stored in this TOML file or image.
# password_env = "OPENWRT_SSH_PASSWORD"
install_wrapper_on_startup = true
known_hosts = "/etc/openwrt-ipv6-watch/known_hosts"
connect_timeout_seconds = 10
command_timeout_seconds = 10
recover_remote_command = "recover"
